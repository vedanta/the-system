name: Deploy Web Distribution

on:
  push:
    branches: [main]
    paths:
      - 'install.sh'
      - 'web/**'
  pull_request:
    branches: [main]
    paths:
      - 'install.sh'
      - 'web/**'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    # DISABLED: Uncomment when domain and secrets are configured
    if: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Update install script in web directory
      run: |
        echo "Copying install script to web directory..."
        cp install.sh web/install.sh

        echo "Verifying install script syntax..."
        bash -n web/install.sh

        echo "Install script updated and verified"

    - name: Generate build info
      run: |
        echo "Generating build information..."
        cat > web/build-info.json << EOF
        {
          "buildTime": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
          "gitCommit": "${{ github.sha }}",
          "gitRef": "${{ github.ref }}",
          "buildNumber": "${{ github.run_number }}",
          "repository": "${{ github.repository }}"
        }
        EOF

    - name: Validate HTML
      run: |
        echo "Basic HTML validation..."
        # Check if required elements exist
        grep -q "<title>" web/index.html
        grep -q "curl -fsSL" web/index.html
        echo "HTML validation passed"

    - name: Deploy to Vercel (Preview)
      if: github.event_name == 'pull_request'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        working-directory: ./web

    - name: Deploy to Vercel (Production)
      if: github.ref == 'refs/heads/main'
      uses: amondnet/vercel-action@v25
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.ORG_ID }}
        vercel-project-id: ${{ secrets.PROJECT_ID }}
        vercel-args: '--prod'
        working-directory: ./web

    - name: Deploy to Netlify (Backup)
      if: github.ref == 'refs/heads/main'
      uses: nwtgck/actions-netlify@v2.0
      with:
        publish-dir: './web'
        production-branch: main
        github-token: ${{ secrets.GITHUB_TOKEN }}
        deploy-message: "Deploy from GitHub Actions - ${{ github.sha }}"
      env:
        NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    - name: Test deployed install script
      if: github.ref == 'refs/heads/main'
      run: |
        echo "Testing deployed install script..."
        sleep 30  # Wait for deployment to propagate

        # Test help flag
        curl -fsSL https://install.the-system.dev/install.sh | bash -s -- --help > /tmp/help-output.txt

        # Verify help output contains expected content
        grep -q "The System - Installation Script" /tmp/help-output.txt
        grep -q "USAGE:" /tmp/help-output.txt
        grep -q "OPTIONS:" /tmp/help-output.txt

        echo "Install script deployment test passed"

    - name: Update deployment status
      if: always()
      run: |
        if [ "${{ job.status }}" == "success" ]; then
          echo "✅ Web deployment successful"
          echo "🌐 Website: https://the-system.dev"
          echo "📥 Install: https://install.the-system.dev/install.sh"
        else
          echo "❌ Web deployment failed"
        fi

  security-scan:
    runs-on: ubuntu-latest
    needs: update-and-deploy
    # DISABLED: Uncomment when domain and secrets are configured
    if: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Security scan of install script
      run: |
        echo "Running security checks on install script..."

        # Check for potential security issues
        if grep -q "curl.*|.*sh" install.sh; then
          echo "⚠️  Script contains pipe-to-shell pattern (expected)"
        fi

        # Check for hardcoded secrets
        if grep -iE "(password|secret|key|token)" install.sh | grep -v "VERCEL_TOKEN\|GITHUB_TOKEN"; then
          echo "❌ Potential hardcoded secrets found"
          exit 1
        fi

        # Check for suspicious commands
        if grep -E "(rm -rf /|sudo rm|mktemp.*\||eval)" install.sh; then
          echo "❌ Suspicious commands found"
          exit 1
        fi

        echo "✅ Security scan passed"

    - name: Lighthouse audit
      run: |
        echo "Would run Lighthouse audit here"
        # In a real setup, you'd use lighthouse-ci
        echo "✅ Lighthouse audit placeholder passed"