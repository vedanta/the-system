version: '3.8'

services:
  jumper-gorilla:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    environment:
      - NGINX_PORT=80
      - NGINX_SSL_PORT=443
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3
        window: 60s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /var/cache/nginx:rw,size=50M
      - /var/run:rw,size=10M
      - /tmp:rw,size=10M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jumper-gorilla.rule=Host(`jumper-gorilla.example.com`)"
      - "traefik.http.routers.jumper-gorilla.tls=true"
      - "traefik.http.routers.jumper-gorilla.tls.certresolver=letsencrypt"
      - "traefik.http.services.jumper-gorilla.loadbalancer.server.port=80"

  # Optional: CDN/Cache layer
  varnish:
    image: varnish:stable
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./varnish.vcl:/etc/varnish/default.vcl:ro
    depends_on:
      - jumper-gorilla
    environment:
      - VARNISH_SIZE=256m
    healthcheck:
      test: ["CMD", "varnishadm", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 256M
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.varnish.rule=Host(`cdn.jumper-gorilla.example.com`)"

# Networks
networks:
  default:
    external: true
    name: web

