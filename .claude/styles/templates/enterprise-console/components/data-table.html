<!-- Enterprise Console Data Table -->
<div class="bg-white border border-gray-200 rounded-lg overflow-hidden">
    <!-- Table Header -->
    <div class="px-6 py-4 border-b border-gray-200">
        <div class="flex justify-between items-center">
            <h2 class="text-gray-900 font-semibold">{{ tableTitle }}</h2>
            <div class="flex space-x-2">
                <!-- Filter Chips -->
                <div class="filter-chip active">All</div>
                <div class="filter-chip">Active</div>
                <div class="filter-chip">Inactive</div>
            </div>
        </div>
    </div>

    <!-- Table -->
    <div class="overflow-x-auto">
        <table class="min-w-full">
            <thead>
                <tr class="table-header">
                    <th class="px-6 py-3 text-left">
                        <input type="checkbox" class="rounded border-gray-300">
                    </th>
                    <th class="px-6 py-3 text-left">Name</th>
                    <th class="px-6 py-3 text-left">Status</th>
                    <th class="px-6 py-3 text-left">Type</th>
                    <th class="px-6 py-3 text-left">Last Updated</th>
                    <th class="px-6 py-3 text-left">Actions</th>
                </tr>
            </thead>
            <tbody>
                <!-- Sample Row -->
                <tr class="table-row">
                    <td class="px-6 py-4">
                        <input type="checkbox" class="rounded border-gray-300">
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">{{ itemName }}</div>
                        <div class="text-sm text-gray-500">{{ itemDescription }}</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="status-badge bg-green-100 text-green-800">Active</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-gray-900">{{ itemType }}</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-gray-500">{{ lastUpdated }}</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex space-x-2">
                            <button class="text-blue-600 hover:text-blue-800 text-sm">Edit</button>
                            <button class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                        </div>
                    </td>
                </tr>

                <!-- Selected Row Example -->
                <tr class="table-row selected">
                    <td class="px-6 py-4">
                        <input type="checkbox" checked class="rounded border-gray-300">
                    </td>
                    <td class="px-6 py-4">
                        <div class="font-medium text-gray-900">Selected Item</div>
                        <div class="text-sm text-gray-500">This row is selected</div>
                    </td>
                    <td class="px-6 py-4">
                        <span class="status-badge bg-yellow-100 text-yellow-800">Pending</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-gray-900">Type B</span>
                    </td>
                    <td class="px-6 py-4">
                        <span class="text-gray-500">2 hours ago</span>
                    </td>
                    <td class="px-6 py-4">
                        <div class="flex space-x-2">
                            <button class="text-blue-600 hover:text-blue-800 text-sm">Edit</button>
                            <button class="text-red-600 hover:text-red-800 text-sm">Delete</button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Table Footer -->
    <div class="px-6 py-4 border-t border-gray-200 flex justify-between items-center">
        <div class="text-sm text-gray-500">
            Showing 1-10 of 50 results
        </div>
        <div class="flex space-x-2">
            <button class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Previous</button>
            <button class="px-3 py-1 bg-blue-600 text-white rounded text-sm">1</button>
            <button class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">2</button>
            <button class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">3</button>
            <button class="px-3 py-1 border border-gray-300 rounded text-sm hover:bg-gray-50">Next</button>
        </div>
    </div>
</div>

<style>
.table-header {
    background: #f8f9fa;
    border-bottom: 2px solid #e5e7eb;
    font-weight: 600;
    font-size: 12px;
    text-transform: uppercase;
    color: #6b7280;
    letter-spacing: 0.025em;
}
.table-row {
    border-bottom: 1px solid #f3f4f6;
    font-size: 13px;
}
.table-row:hover {
    background: #f9fafb;
}
.table-row.selected {
    background: #eff6ff;
}
.status-badge {
    font-size: 11px;
    font-weight: 600;
    padding: 3px 8px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.025em;
}
.filter-chip {
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid #e5e7eb;
    background: white;
    cursor: pointer;
    transition: all 0.15s;
}
.filter-chip:hover {
    border-color: #2563eb;
    background: #eff6ff;
}
.filter-chip.active {
    background: #2563eb;
    color: white;
    border-color: #2563eb;
}
</style>
