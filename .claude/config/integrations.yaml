# ============================================================================
# THE SYSTEM - Third-Party Integrations
# ============================================================================
# Configure which integrations are enabled and their settings.
# Secrets should be in .env, not here.
# ============================================================================

# ----------------------------------------------------------------------------
# FINANCIAL SERVICES
# ----------------------------------------------------------------------------
financial:
  plaid:
    enabled: false
    environment: sandbox  # sandbox | development | production
    products:
      - transactions
      - auth
      - identity
      - balance
    country_codes:
      - US
    webhook_url: /api/v1/webhooks/plaid
  
  stripe:
    enabled: false
    webhook_endpoint: /api/v1/webhooks/stripe
    payment_methods:
      - card
      - us_bank_account
    features:
      subscriptions: true
      invoicing: false
      connect: false

# ----------------------------------------------------------------------------
# COMMUNICATION
# ----------------------------------------------------------------------------
communication:
  email:
    provider: sendgrid  # sendgrid | ses | postmark | mailgun
    enabled: false
    from_address: noreply@example.com
    from_name: "My App"
    templates:
      welcome: d-xxxxx
      password_reset: d-xxxxx
      verification: d-xxxxx
  
  sms:
    provider: twilio  # twilio | sns | vonage
    enabled: false
  
  push_notifications:
    provider: firebase  # firebase | onesignal | pusher
    enabled: false

# ----------------------------------------------------------------------------
# AUTHENTICATION PROVIDERS
# ----------------------------------------------------------------------------
auth_providers:
  google:
    enabled: false
    scopes:
      - email
      - profile
  
  github:
    enabled: false
    scopes:
      - user:email
  
  apple:
    enabled: false
  
  microsoft:
    enabled: false

# ----------------------------------------------------------------------------
# STORAGE
# ----------------------------------------------------------------------------
storage:
  provider: s3  # s3 | gcs | azure-blob | cloudinary
  enabled: false
  bucket_name: my-app-uploads
  max_file_size_mb: 10
  allowed_types:
    - image/jpeg
    - image/png
    - image/gif
    - application/pdf
  
  cdn:
    enabled: false
    provider: cloudfront  # cloudfront | cloudflare | fastly

# ----------------------------------------------------------------------------
# AI / ML SERVICES
# ----------------------------------------------------------------------------
ai:
  openai:
    enabled: false
    default_model: gpt-4
    embeddings_model: text-embedding-3-small
  
  anthropic:
    enabled: false
    default_model: claude-sonnet-4-20250514
  
  vector_db:
    provider: pinecone  # pinecone | weaviate | qdrant | pgvector
    enabled: false

# ----------------------------------------------------------------------------
# ANALYTICS
# ----------------------------------------------------------------------------
analytics:
  google_analytics:
    enabled: false
    measurement_id: G-XXXXXXXX
  
  mixpanel:
    enabled: false
  
  amplitude:
    enabled: false
  
  posthog:
    enabled: false
    self_hosted: false

# ----------------------------------------------------------------------------
# MONITORING & OBSERVABILITY
# ----------------------------------------------------------------------------
monitoring:
  sentry:
    enabled: false
    traces_sample_rate: 0.1
    profiles_sample_rate: 0.1
  
  datadog:
    enabled: false
    apm_enabled: true
    logs_enabled: true
  
  prometheus:
    enabled: false
    metrics_endpoint: /metrics

# ----------------------------------------------------------------------------
# NOTIFICATIONS & ALERTS
# ----------------------------------------------------------------------------
notifications:
  slack:
    enabled: false
    channels:
      alerts: "#alerts"
      deployments: "#deployments"
      errors: "#errors"
  
  pagerduty:
    enabled: false
  
  opsgenie:
    enabled: false

# ----------------------------------------------------------------------------
# FEATURE FLAGS
# ----------------------------------------------------------------------------
feature_flags:
  provider: launchdarkly  # launchdarkly | flagsmith | unleash | custom
  enabled: false

# ----------------------------------------------------------------------------
# SEARCH
# ----------------------------------------------------------------------------
search:
  provider: algolia  # algolia | elasticsearch | meilisearch | typesense
  enabled: false
