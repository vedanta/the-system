# ============================================================================
# THE SYSTEM - AI Success Profiles for Claude Code Stack Assessment
# ============================================================================
# Contains empirical data about Claude Code success rates across technologies.
# Used by Solution Architect agent for AI-optimized stack recommendations.
# ============================================================================

version: "1.0"
meta:
  description: "AI success metrics for Claude Code technology stack assessment"
  last_updated: "2025-01-01"
  data_source: "Empirical Claude Code build analysis and performance data"
  total_technologies: 47
  total_presets: 8

# ============================================================================
# ASSESSMENT CONFIGURATION
# ============================================================================

assessment_config:
  # Multi-criteria decision weights (must sum to 1.0)
  weights:
    claude_success_rate: 0.35     # Primary factor - how well Claude builds this
    build_reliability: 0.20       # Does generated code compile and run?
    debug_ease: 0.15             # How easy to fix when Claude gets it wrong?
    code_quality: 0.10           # Quality of AI-generated code patterns
    documentation: 0.10          # AI training data quality and abundance
    ecosystem_stability: 0.05    # Breaking change frequency and stability
    traditional_factors: 0.05    # KISS, time-to-market, etc.

  # Scoring thresholds for recommendations
  thresholds:
    excellent: 9.0               # 9.0+ = Excellent choice for Claude
    good: 8.0                    # 8.0-8.9 = Good choice, recommended
    acceptable: 7.0              # 7.0-7.9 = Acceptable, some trade-offs
    poor: 6.0                    # 6.0-6.9 = Workable but challenging
    avoid: 0.0                   # <6.0 = Avoid unless specific requirements

  # Confidence levels for decision making
  confidence:
    high_threshold: 8.5          # High confidence recommendation
    medium_threshold: 7.5        # Medium confidence recommendation
    low_threshold: 6.5           # Low confidence, consider alternatives

  # AI-specific optimization factors
  ai_optimization:
    minimum_success_rate: 0.75   # Don't recommend stacks <75% success
    prefer_documented: true      # Favor well-documented technologies
    prefer_stable: true          # Favor stable, mature technologies
    avoid_bleeding_edge: true    # Avoid newest, unstable versions

