# ============================================================================
# SUCCESS OPTIMIZATION STRATEGIES
# ============================================================================

optimization_strategies:
  high_success_stacks:
    description: "Technology combinations with >90% Claude success rate"
    combinations:
      - name: "Static Next.js"
        technologies: ["nextjs_14", "tailwind", "typescript"]
        success_rate: 0.95
        use_case: "Landing pages, documentation, marketing sites"

      - name: "Embedded Next.js + SQLite"
        technologies: ["nextjs_14", "sqlite_drizzle", "nextauth", "typescript"]
        success_rate: 0.90
        use_case: "Personal tools, small business apps, prototypes"

      - name: "CLI Script Node.js"
        technologies: ["node_typescript", "tsx", "commander"]
        success_rate: 0.91
        use_case: "Automation scripts, development tools"

  risk_mitigation_patterns:
    low_success_technologies:
      - technology: "nestjs"
        risk_level: "high"
        mitigation: "Use Express.js instead for better Claude success"
        fallback: "express_js"

      - technology: "mongodb"
        risk_level: "medium"
        mitigation: "Consider PostgreSQL for better type safety"
        fallback: "postgresql_prisma"

      - technology: "django"
        risk_level: "medium"
        mitigation: "Use FastAPI for better Claude Code patterns"
        fallback: "fastapi"

  ai_optimization_tips:
    general:
      - "Prefer TypeScript over JavaScript for better error detection"
      - "Use well-documented frameworks with consistent patterns"
      - "Avoid bleeding-edge technologies with limited examples"
      - "Choose technologies with strong IDE and tooling support"
      - "Prioritize technologies with active community and examples"

    specific:
      frontend:
        - "Next.js App Router over Pages Router for consistency"
        - "Tailwind CSS over custom CSS for predictable styling"
        - "TypeScript strict mode for better error detection"

      backend:
        - "API Routes over custom server for simplicity"
        - "Prisma over raw SQL for type safety"
        - "Standard authentication over custom implementation"

      database:
        - "PostgreSQL over NoSQL for structured data"
        - "ORM/query builders over raw queries"
        - "Schema-first design for better type generation"

# ============================================================================
# ASSESSMENT ALGORITHM CONFIGURATION
# ============================================================================

algorithm_config:
  scoring_method: "weighted_average"
  normalization: "min_max_scaling"

  decision_logic:
    # Automatic recommendations based on scores
    auto_recommend_threshold: 8.5    # Auto-recommend if score >8.5
    warn_threshold: 7.0              # Warn if score <7.0
    block_threshold: 6.0             # Block if score <6.0 (unless override)

  # Performance targets for different build types
  performance_targets:
    prototype:
      target_score: 8.5              # Aim for high Claude success
      max_debug_time: "3 hours"      # Maximum acceptable debug time
      min_success_rate: 0.85         # Minimum success probability

    mvp:
      target_score: 8.0
      max_debug_time: "4 hours"
      min_success_rate: 0.80

    production:
      target_score: 7.5              # Can accept more complexity for features
