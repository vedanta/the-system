[build]
  publish = "."
  command = "echo 'No build step required'"

[build.environment]
  NODE_VERSION = "18"

# Install script headers
[[headers]]
  for = "/install.sh"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=300, s-maxage=300"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

# Security headers for all files
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# HTML files get additional security
[[headers]]
  for = "/*.html"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https:; connect-src 'self' https://api.github.com;"

# Redirects
[[redirects]]
  from = "/install"
  to = "/install.sh"
  status = 301
  force = true

[[redirects]]
  from = "/get"
  to = "/install.sh"
  status = 301
  force = true

[[redirects]]
  from = "/setup"
  to = "/install.sh"
  status = 301
  force = true

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "cp ../install.sh ./install.sh && echo 'Install script updated'"

[context.deploy-preview]
  command = "cp ../install.sh ./install.sh && echo 'Install script updated for preview'"

[dev]
  command = "python3 -m http.server 8888"
  targetPort = 8888
  port = 8080
  publish = "."
  autoLaunch = true